register_door:
  name: Register door
  description: Add or update an ESP-RFID V3 door node in Home Assistant storage.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:
    name:
      required: true
      example: Front Door
      selector:
        text:
    base_url:
      required: true
      example: http://192.168.1.40
      selector:
        text:
    api_token:
      required: true
      example: secret-token
      selector:
        text:
    allow_hold_open:
      required: false
      default: true
      selector:
        boolean:
    enabled:
      required: false
      default: true
      selector:
        boolean:

remove_door:
  name: Remove door
  description: Remove a configured door node from Home Assistant storage.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:

register_user:
  name: Register user
  description: Add or update a centrally managed access user for one or more doors.
  fields:
    user_id:
      required: true
      example: dennis
      selector:
        text:
    name:
      required: true
      example: Dennis
      selector:
        text:
    door_ids:
      required: true
      example:
        - frontdoor
        - backdoor
      selector:
        object:
    rfid_uid:
      required: false
      example: A1B2C3D4
      selector:
        text:
    pin:
      required: false
      example: "1234"
      selector:
        text:
    active:
      required: false
      default: true
      selector:
        boolean:
    valid_from:
      required: false
      example: 2026-04-08T12:00:00+00:00
      selector:
        text:
    valid_until:
      required: false
      example: 2026-12-31T23:59:59+00:00
      selector:
        text:

remove_user:
  name: Remove user
  description: Remove a centrally managed access user.
  fields:
    user_id:
      required: true
      example: dennis
      selector:
        text:

pulse_unlock:
  name: Pulse unlock
  description: Trigger a momentary unlock pulse on a specific door.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:
    reason:
      required: false
      example: manual_open
      selector:
        text:

hold_unlock:
  name: Hold unlock
  description: Hold the unlock output active until it is cancelled.
  fields:
    device_id:
      required: true
      example: backdoor
      selector:
        text:
    reason:
      required: false
      example: cleaning_window
      selector:
        text:

cancel_hold:
  name: Cancel hold
  description: Cancel a previously activated hold-open state.
  fields:
    device_id:
      required: true
      example: backdoor
      selector:
        text:
    reason:
      required: false
      example: normal_operation
      selector:
        text:

resync_door:
  name: Resync door
  description: Ask a door node to fetch or apply the latest snapshot.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:

sync_all:
  name: Sync all
  description: Refresh all configured door nodes in Home Assistant.

reboot_door:
  name: Reboot door
  description: Reboot a specific door node.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:

push_snapshot:
  name: Push snapshot
  description: Build and push the latest snapshot for one specific door.
  fields:
    device_id:
      required: true
      example: frontdoor
      selector:
        text:

push_all_snapshots:
  name: Push all snapshots
  description: Build and push fresh snapshots to all configured door nodes.
