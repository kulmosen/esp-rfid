name: Platformio build

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.10
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Platformio
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install simulator dependencies
      run: |
        npm ci --prefix tools/simulator
    - name: Install Playwright browser
      run: |
        npx --prefix tools/simulator playwright install chromium
    - name: Run simulator smoke test
      run: |
        npm --prefix tools/simulator run smoke
    - name: Run simulator browser e2e test
      run: |
        npm --prefix tools/simulator run e2e
    - name: Run host tests
      run: |
        chmod +x tests/host/run.sh
        tests/host/run.sh
    - name: Run Platformio builds
      run: |
        platformio run -e generic -e debug
    - name: Export bins
      uses: actions/upload-artifact@v4
      with:
        name: bins
        path: |
          bin/generic.bin
          bin/forV2Board.bin
          bin/debug.bin
